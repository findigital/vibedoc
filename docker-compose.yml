version: '3.8'

services:
  # PostgreSQL Database (SaaS)
  db:
    image: postgres:15-alpine
    container_name: vibedoc-db
    environment:
      POSTGRES_DB: vibedoc
      POSTGRES_USER: vibedoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vibedoc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibedoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibedoc-network
    restart: unless-stopped

  # VibeDoc SaaS Web Application
  web:
    build: .
    container_name: vibedoc-web
    command: python saas_app.py
    environment:
      - DATABASE_URL=postgresql://vibedoc:${DB_PASSWORD:-vibedoc_password}@db:5432/vibedoc
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PORT=7860
      - ENVIRONMENT=production
    ports:
      - "7860:7860"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - vibedoc-network

  # VibeDoc API Server
  api:
    build: .
    container_name: vibedoc-api
    command: python api.py
    environment:
      - DATABASE_URL=postgresql://vibedoc:${DB_PASSWORD:-vibedoc_password}@db:5432/vibedoc
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - vibedoc-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vibedoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibedoc-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: vibedoc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - vibedoc-network

volumes:
  postgres_data:
  redis_data:

networks:
  vibedoc-network:
    driver: bridge